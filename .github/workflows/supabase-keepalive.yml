# Supabase pauses free projects after 7 days of inactivity.
# Read one row every 3 days so the database stays awake.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query matches table
        run: |
          curl --fail -sS "https://osbbviimzoqaeyneogtp.supabase.co/rest/v1/matches?select=id&limit=1" \
            -H "apikey: sb_publishable_7LNEQqzEeiCw_giwIWP44g_8M7_cxvz"
